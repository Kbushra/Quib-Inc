<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Quib Inc." />
    <meta
      property="og:description"
      content="A website to give updates on Quib Inc. and its affiliated Mediaocre Games, providing their content."
    />
    <meta
      property="og:image"
      content="https://quibinc.dpdns.org/assets/images/mainpage.png"
    />
    <meta property="og:url" content="https://quibinc.dpdns.org" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quib Inc." />
    <meta
      name="twitter:description"
      content="A website to give updates on Quib Inc. and its affiliated Mediaocre Games, providing their content."
    />
    <meta
      name="twitter:image"
      content="https://quibinc.dpdns.org/assets/images/mainpage.png"
    />

    <title>Quib Inc.</title>
    <link rel="icon" type="image/apng" href="favicon.apng" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/entrypoint.css" />
  </head>
  <body>
    <div id="main-container">
      <div id="main">
        <section class="panel grid">
          <div class="column-flex" style="align-items: flex-start; justify-content: center; gap: 1.35rem;">
            <h1 style="margin-bottom: 0; font-size: 5.8rem;">Games, Music, Websites</h1>
            <p style="text-align: left; font-size: 1.5rem; width: 42rem;">
              Quib Inc. is an organisation managed by Aaqib Choudhury. We build
              jam games, original soundtracks, and interactive web projects with
              a focus on creativity and learning.
            </p>
            <div class="row-flex" style="gap: 0.9rem;">
              <a class="linked-pill main-focus" href="/projs/games">Explore Games</a>
              <a class="linked-pill" href="/projs/music">Listen to Music</a>
              <a class="linked-pill" href="/projs/websites">See Web Projects</a>
            </div>
          </div>

          <div class="grid" id="featured-games">
            <a class="linked-panel" href="/game-page?game-id=polydraws">
              <img src="/assets/images/polydrawstitle.png" alt="Polydraws" />
              <span>Polydraws</span>
            </a>
          </div>
        </section>

        <section style="width: 100%; padding: 0.25rem 0.15rem 0.8rem;">
          <div class="row-flex" style="justify-content: space-between;">
            <p style="font-size: 1rem; letter-spacing: 0.08rem; color: var(--text-muted);">MOST RECENT NEWSLETTER</p>
            <a style="font-size: 0.9rem;" href="/info/news">View All Updates</a>
          </div>
          <div id="news-container" amount="preview" style="width: 100%"></div>
        </section>

        <div id="footer-container"></div>
      </div>
    </div>

    <div id="header-container"></div>

    <script src="/scripts/entrypoint.js" type="module" defer></script>
  </body>
</html>
