<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quib Inc.</title>
        <link rel="icon" type="image/apng" href="/favicon.apng">
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <div id="main-container">
            <div id="main">
                <img style="position: relative; top: calc(var(--scale-media-width) * 10/var(--scale-width)); width: calc(var(--pos-media-width) * 80/var(--scale-width)); border-radius: 10%;" src="./favicon.apng">

                <p style="font-size: 2rem; top: calc(var(--scale-media-width) * -20/var(--scale-width)); width: calc(var(--pos-media-width) * 800/var(--scale-width));">
                    Quib Inc. is an organisation managed by Aaqib Choudhury in order to provide curated games, music and websites.<br>
                    <br>
                    From OSTs to game jams, websites, hackathons and more!
                </p>
                
                <div class="row-flex" style="height: 0px; align-items: flex-start;">
                    <div class="column-flex" style="align-items: flex-start; position: relative; top: calc(var(--pos-media-width) * -400/var(--scale-width)); left: calc(var(--pos-media-width) * -750/var(--scale-width))">
                        <img style="position: relative; width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/paperjam.gif">
                        <img style="position: relative; top: calc(var(--pos-media-width) * -50/var(--scale-width)); width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/polydraws.png">
                        <img style="position: relative; top: calc(var(--pos-media-width) * -20/var(--scale-width)); width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/energyjam.gif">
                        <img style="position: relative; top: calc(var(--pos-media-width) * -40/var(--scale-width)); width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/chargecycle.png">
                        <img style="position: relative; width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/progressbar.png">
                        <img style="position: relative; top: calc(var(--pos-media-width) * -40/var(--scale-width)); width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/testimonial.png">
                    </div>
                    <div class="column-flex" style="align-items: flex-start; position: relative; top: calc(var(--pos-media-width) * -400/var(--scale-width)); left: calc(var(--pos-media-width) * -740/var(--scale-width))">
                        <img style="position: relative; width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/screensaver.png">
                        <img style="position: relative; top: calc(var(--pos-media-width) * -20/var(--scale-width)); width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/searcher.png">
                    </div>
                </div>

                <div class="column-flex" style="position: relative; top: calc(var(--pos-media-width) * -20/var(--scale-width));">
                    <div class="row-flex">
                        <img style="position: relative; width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/polydrawstitle.png">
                        <img style="position: relative; width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/chargecycletitle.png">
                    </div>
                    <div class="row-flex">
                        <img style="position: relative; width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/nestkeepingtitle.png">
                        <img style="position: relative; width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/bhwhtitle.png">
                    </div>
                </div>

                <div class="row-flex" style="height: 0px; align-items: flex-start;">
                    <div class="column-flex" style="align-items: flex-start; position: relative; top: calc(var(--pos-media-width) * -180/var(--scale-width)); left: calc(var(--pos-media-width) * 740/var(--scale-width))">
                        <img style="position: relative; width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/screensaver.png">
                        <img style="position: relative; top: calc(var(--pos-media-width) * -20/var(--scale-width)); width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/searcher.png">
                    </div>
                    <div class="column-flex" style="align-items: flex-start; position: relative; top: calc(var(--pos-media-width) * -720/var(--scale-width)); left: calc(var(--pos-media-width) * 750/var(--scale-width))">
                        <img style="position: relative; width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/paperjam.gif">
                        <img style="position: relative; top: calc(var(--pos-media-width) * -50/var(--scale-width)); width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/polydraws.png">
                        <img style="position: relative; top: calc(var(--pos-media-width) * -20/var(--scale-width)); width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/energyjam.gif">
                        <img style="position: relative; top: calc(var(--pos-media-width) * -40/var(--scale-width)); width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/chargecycle.png">
                        <img style="position: relative; width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/progressbar.png">
                        <img style="position: relative; top: calc(var(--pos-media-width) * -40/var(--scale-width)); width: calc(var(--pos-media-width) * 200/var(--scale-width)); border-radius: 10%;" src="./Images/testimonial.png">
                    </div>
                </div>

                <p style="font-size: 2rem; top: calc(var(--pos-media-width) * -40/var(--scale-width)); width: calc(var(--pos-media-width) * 800/var(--scale-width)); text-align: center;">
                    ⌄⌄⌄ Most recent newsletter ⌄⌄⌄
                </p>
                <div id="news-container" amount="preview"></div>

                <div id="footer-container"></div>
            </div>
        </div>

        <div id="header-container"></div>

        <script src="/elements.js" defer></script>
    </body>
</html>
