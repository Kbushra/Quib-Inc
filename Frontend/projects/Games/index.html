<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quib Inc.</title>
    <link rel="icon" type="image/gif" href="./favicon.ico">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <script src="/index.js" defer></script>

    <div class="header">
        <div class="masthead clickable" onclick="window.location.href = '/'" tabindex="0">
            <p style="font-size: 40px; top: -40px; left: 10px;">Quib Inc.</p>
            <p style="font-size: 10px; top: 35px; left: 35px;">Games, Music, Websites</p>
        </div>

        <div class="mode clickable" onclick="swapCol()" tabindex="0"><p style="top: -10px; left: 60px; font-size: 20px;">Mode</p></div>
    </div>
    
    <div class="main">
        <p style="font-size: 30px; top: -10px; left: calc(50vw - 250px); width: 500px; text-align: center;">
            Games.
        </p>
    </div>

    <div class="dropdown" style="left: calc(100vw - 480px);" tabindex="0">
        <p style="top: -15px; font-size: 30px;">Oth. Orgs</p>
        <p class="subdrop clickable" onclick="window.location.href = '/otherorgs/info'" style="--targ-top: 55px; font-size: 30px;" tabindex="0">Info</p>
        <p class="subdrop clickable" onclick="window.location.href = '/otherorgs/content'" style="--targ-top: 125px; font-size: 30px;" tabindex="0">Content</p>
        <p class="subdrop clickable" onclick="window.location.href = '/otherorgs/contact'" style="--targ-top: 195px; font-size: 30px;" tabindex="0">Contact</p>
    </div>

    <div class="dropdown" style="left: calc(100vw - 320px);" tabindex="0">
        <p style="top: -15px; font-size: 30px;">Projects</p>
        <p class="subdrop clickable" onclick="window.location.href = '/projects/games'" style="--targ-top: 55px; font-size: 30px;" tabindex="0">Games</p>
        <p class="subdrop clickable" onclick="window.location.href = '/projects/music'" style="--targ-top: 125px; font-size: 30px;" tabindex="0">Music</p>
        <p class="subdrop clickable" onclick="window.location.href = '/projects/websites'" style="--targ-top: 195px; font-size: 30px;" tabindex="0">Websites</p>
    </div>

    <div class="dropdown" style="left: calc(100vw - 160px);" tabindex="0">
        <p style="top: -15px; font-size: 30px;">Info</p>
        <p class="subdrop clickable" onclick="window.location.href = '/info/team'" style="--targ-top: 55px; font-size: 30px;" tabindex="0">Team</p>
        <p class="subdrop clickable" onclick="window.location.href = '/info/contact'" style="--targ-top: 125px; font-size: 30px;" tabindex="0">Contact</p>
    </div>
</body>
</html>
