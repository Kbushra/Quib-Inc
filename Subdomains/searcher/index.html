<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Searcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <input id="search" type="search" placeholder="Search for image">
        <button style="position: absolute; left: 1260px; top: 50px; width: 100px; height: 50px; border-radius: 20%;">Next</button>
        <p id="result" style="position: absolute; width: 1920px; font-size: 20px; text-align: center; top: 100px;"></p>

        <figure>
            <img src="" style="visibility: hidden;">
            <figcaption></figcaption>
        </figure>
        
        <script src="searcher.js"></script>
    </div>
</body>
</html>
