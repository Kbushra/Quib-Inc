<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quib Inc.</title>
        <link rel="icon" type="image/gif" href="favicon.apng">
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <div id="main-container">
            <div id="main">
                <p style="font-size: var(--font-big); width: calc(var(--media-width) * 800/var(--scale-width));">
                    Here, you can find games produced by Quib Inc. alongside their embeds (click to start).
                    For more info, you can check Info/Team for itch.io accounts.<br>
                    (Note that these are not mobile games.)
                </p>

                <div id="games" class="row-flex" style="justify-content: space-evenly; flex-wrap: wrap; width: var(--media-width); row-gap: calc(var(--media-width) * 600/var(--scale-width));"></div>
            </div>
        </div>

        <div id="header-container"></div>

        <script src="/elements.js"></script>
    </body>
</html>
