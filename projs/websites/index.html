<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quib Inc.</title>
    <link rel="icon" type="image/gif" href="favicon.apng">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="main-container">
        <div id="main">
            <p style="font-size: var(--font-big); width: calc(var(--media-width) * 800/var(--scale-width));">
                Here, you can find websites produced by Quib Inc. (click to open).
                For now, most of these are test projects for learning website developement, but it may grow into something much larger.
            </p>

            <div id="website" class="row-flex" style="justify-content: space-evenly; flex-wrap: wrap; width: var(--media-width); row-gap: calc(var(--media-width) * 100/var(--scale-width));"></div>
            <div style="height: calc(var(--media-width) * 300/var(--scale-width));"></div>
        </div>
    </div>

    <div id="header-container"></div>
    
    <script src="/index.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" src="/elements.jsx"></script>
</body>
</html>
