<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quib Inc.</title>
        <link rel="icon" type="image/gif" href="favicon.apng">
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <div id="main-container">
            <div id="main">
                <p style="font-size: 5rem; margin-top: 0; margin-bottom: 0;">Mediaocre Games</p>

                <p style="font-size: var(--font-big); width: calc(var(--media-width) * 800/var(--scale-width));">
                    Quib Inc. is associated with Mediaocre Games for non-personal, larger projects.<br>
                    They comprise of Krystal (Krys for short), Jayden, Ava and Aaqib.<br>
                    <br>
                    Together, we work on making original games as well as fangames for popular indies such as Undertale.
                </p>

                <div class="row-flex">
                    <img src="/Images/darkness.png" style="position: relative; height: calc(var(--media-width) * 400/var(--scale-width));">
                    <img src="/Images/undertembattle.webp" style="position: relative; height: calc(var(--media-width) * 400/var(--scale-width));">
                </div>

                <div style="height: calc(var(--media-width) * 300/var(--scale-width));"></div>
            </div>
        </div>

        <div id="header-container"></div>

        <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
        <script type="text/babel" src="/elements.jsx"></script>
    </body>
</html>
